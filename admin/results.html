<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ফলাফল ও অংশগ্রহণ — অ্যাডমিন</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin">

<div class="admin-shell">
  <nav class="admin-nav" id="admin-nav"></nav>
  <div class="admin-main">
    <div class="toolbar">
      <div>
        <h1>ফলাফল ও অংশগ্রহণ</h1>
        <p class="hint">সকল শিক্ষার্থীর অংশগ্রহণের তালিকা (সব ডিভাইস থেকে)।</p>
      </div>
    </div>

    <table>
      <thead>
        <tr><th>নাম</th><th>ক্লাস / ফোন</th><th>পরীক্ষা</th><th>স্কোর</th><th>অবস্থা</th><th>সময়</th></tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { renderAdminNav } from "../js/admin-nav.js";
  import { getAllAttempts, getAllQuizzes } from "../js/data.js";

  renderAdminNav("results.html");

  const attempts = await getAllAttempts();
  const quizzes = await getAllQuizzes();
  const quizById = Object.fromEntries(quizzes.map(q => [q.id, q]));

  const body = document.getElementById("results-body");
  if (attempts.length === 0) {
    body.innerHTML = `<tr><td colspan="6" class="hint">এখনও কোনো অংশগ্রহণ নেই।</td></tr>`;
  }
  attempts.forEach(a => {
    const quiz = quizById[a.quizId];
    const when = a.startedAt ? new Date(a.startedAt).toLocaleString("bn-BD") : "—";
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${a.student?.name || "—"}</td>
      <td>${a.student?.cls || "—"} / ${a.student?.phone || a.student?.roll || "—"}</td>
      <td>${quiz ? quiz.title_bn : a.quizId}</td>
      <td>${a.score !== undefined ? `${a.score}/${a.total}` : "চলমান"}</td>
      <td>${a.status === "ended-early"
        ? '<span class="pill warn">সময়ের আগে বন্ধ</span>'
        : a.status === "completed"
          ? '<span class="pill ok">সম্পন্ন</span>'
          : '<span class="hint">চলমান</span>'}</td>
      <td class="hint">${when}</td>
    `;
    body.appendChild(tr);
  });
</script>
</body>
</html>
