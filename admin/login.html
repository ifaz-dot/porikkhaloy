<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>অ্যাডমিন লগইন — পরীক্ষালয়</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin">

<main style="padding-top:80px;">
  <div class="shell" style="max-width:420px;">
    <div class="kicker" style="color:var(--mustard); font-weight:600; margin-bottom:8px;">পরীক্ষালয়</div>
    <h1 style="font-size:1.6rem;">অ্যাডমিন প্যানেল</h1>
    <p class="hint" style="margin-bottom:24px;">শুধুমাত্র অনুমোদিত অ্যাডমিনরা এখানে প্রবেশ করতে পারবেন।</p>

    <div class="error-box" id="err"></div>

    <form class="card" id="login-form" style="max-width:100%;">
      <div class="field">
        <label for="email">ইমেইল</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="pass">পাসওয়ার্ড</label>
        <input type="password" id="pass" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="submit-btn">লগইন করো</button>
    </form>
  </div>
</main>

<script type="module">
  import { auth, db } from "../js/firebase-config.js";
  // BUG FIX: signOut must be imported and called as signOut(auth) — the
  // modular v9 Firebase SDK does NOT expose auth.signOut() as a method
  // on the auth instance. The old code called `auth.signOut()` directly,
  // which threw a TypeError at runtime. Because that line ran outside
  // any try/catch, the error was uncaught: the "not an admin" message
  // still flashed on screen, but the function then crashed and the
  // rejected (non-admin) user was NEVER actually signed out — they
  // stayed authenticated in the browser.
  import { signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const err = document.getElementById("err");
  const btn = document.getElementById("submit-btn");

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    err.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "যাচাই করা হচ্ছে…";

    const email = document.getElementById("email").value.trim();
    const pass = document.getElementById("pass").value;

    try {
      const cred = await signInWithEmailAndPassword(auth, email, pass);
      const adminDoc = await getDoc(doc(db, "admins", cred.user.uid));

      if (!adminDoc.exists()) {
        err.textContent = "এই অ্যাকাউন্টের অ্যাডমিন অনুমতি নেই।";
        err.classList.add("show");
        await signOut(auth);
        btn.disabled = false;
        btn.textContent = "লগইন করো";
        return;
      }

      location.href = "dashboard.html";
    } catch (error) {
      err.textContent = "ভুল ইমেইল বা পাসওয়ার্ড।";
      err.classList.add("show");
      btn.disabled = false;
      btn.textContent = "লগইন করো";
    }
  });
</script>
</body>
</html>
