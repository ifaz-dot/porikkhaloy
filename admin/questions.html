<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>প্রশ্ন ব্যাংক — অ্যাডমিন</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin">

<div class="admin-shell">
  <nav class="admin-nav" id="admin-nav"></nav>
  <div class="admin-main">
    <div class="toolbar">
      <div>
        <h1>প্রশ্ন ব্যাংক</h1>
        <p class="hint">বিষয় ও পরীক্ষা অনুযায়ী প্রশ্ন দেখো ও পরিচালনা করো।</p>
      </div>
      <button class="btn btn-primary" id="add-btn">+ নতুন প্রশ্ন যোগ করো</button>
    </div>

    <div id="quiz-groups"></div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/admin-nav.js"></script>
<script>
  renderAdminNav("questions.html");

  const container = document.getElementById("quiz-groups");
  QUIZZES.forEach(quiz => {
    const subject = getSubjects().find(s => s.id === quiz.subjectId);
    const wrap = document.createElement("div");
    wrap.style.marginBottom = "32px";
    wrap.innerHTML = `
      <h2 style="font-size:1.1rem; border-bottom:1px solid var(--rule); padding-bottom:10px;">
        ${quiz.title_bn} <span class="hint">— ${subject.name_bn}</span>
      </h2>
      <table>
        <thead><tr><th style="width:44px;">#</th><th>প্রশ্ন</th><th style="width:140px;">সঠিক উত্তর</th></tr></thead>
        <tbody>
          ${quiz.questions.map((q, i) => `
            <tr>
              <td>${i + 1}</td>
              <td>${q.text_bn}</td>
              <td>${["ক","খ","গ","ঘ","ঙ"][q.correctIndex]}. ${q.options_bn[q.correctIndex]}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
    container.appendChild(wrap);
  });

  document.getElementById("add-btn").addEventListener("click", () => {
    // Real backend: opens a form that writes a new doc to
    // /questions in Firestore. Wired up once the backend is connected.
    alert("ব্যাকএন্ড যুক্ত হলে এখানে নতুন প্রশ্ন যোগ করার ফর্ম খুলবে।");
  });
</script>
</body>
</html>
