<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subject — Porikkhaloy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="shell">
    <a href="index.html" class="brand"><span class="brand-bn" data-i18n="brand">Porikkhaloy</span></a>
    <nav style="display:flex; gap:16px; align-items:center;" id="nav-extra">
      <a href="index.html" class="hint" data-i18n="backToSubjects">← Back to subjects</a>
    </nav>
  </div>
</header>

<main>
  <div class="shell">
    <section class="hero" style="padding-bottom:24px; margin-bottom:32px;">
      <div class="kicker" id="subject-kicker">Subject</div>
      <h1 id="subject-title" style="font-size:2rem;" data-i18n="loading">Loading…</h1>
    </section>

    <section class="block">
      <h2 data-i18n="availableExams">Available exams</h2>
      <div id="quiz-list"></div>
    </section>
  </div>
</main>

<script type="module">
  import { applyI18n, t } from "./js/i18n.js";
  import { applyTheme } from "./js/theme.js";
  import { renderSiteNavExtras } from "./js/site-header.js";
  import { getSubjects, getQuizzesBySubject, hasAttempted, getExamWindowStatus, areResultsVisible } from "./js/data.js";

  applyTheme();
  applyI18n();
  const nav = document.getElementById("nav-extra");
  const backLink = nav.firstElementChild;
  renderSiteNavExtras(nav);
  nav.insertBefore(backLink, nav.firstChild);

  const params = new URLSearchParams(location.search);
  const subjectId = params.get("id");
  const list = document.getElementById("quiz-list");

  const subjects = await getSubjects();
  const subject = subjects.find(s => s.id === subjectId);

  if (!subject) {
    document.getElementById("subject-title").textContent = t("subjectNotFound");
  } else {
    document.getElementById("subject-kicker").textContent = subject.name_en || "";
    document.getElementById("subject-title").textContent = subject.name_bn;

    const quizzes = await getQuizzesBySubject(subjectId);

    function makeCard(q, isNewest) {
      const already = hasAttempted(q.id);
      const card = document.createElement("div");
      card.className = "card";
      card.style.marginBottom = "16px";
      card.style.maxWidth = "100%";
      if (isNewest) { card.style.borderColor = "var(--mustard)"; card.style.borderWidth = "2px"; }
      card.innerHTML = `
        ${isNewest ? `<div class="kicker" style="margin-bottom:6px;">নতুন</div>` : ""}
        <h3 style="font-size:1.1rem;">${q.title_bn}</h3>
        <p class="hint">${t("duration")}: ${Math.floor(q.durationSeconds / 60)} ${t("minutes")} · ${t("questions")}: ${(q.questions || []).length}</p>
        ${already
          ? `<span class="status-tag ended-early">${t("alreadyAttempted")}</span>`
          : `<a class="btn btn-mustard" href="start.html?quiz=${q.id}">${t("startExamBtn")}</a>`}
      `;
      return card;
    }

    const current = quizzes.filter(q => getExamWindowStatus(q) !== "closed");
    const previous = quizzes.filter(q => getExamWindowStatus(q) === "closed");

    if (quizzes.length === 0) {
      list.innerHTML = `<p class="hint">${t("noExamsYet")}</p>`;
    } else {
      current.forEach((q, i) => list.appendChild(makeCard(q, i === 0)));

      if (previous.length > 0) {
        const h = document.createElement("h3");
        h.style.marginTop = "36px";
        h.textContent = "পূর্ববর্তী পরীক্ষা";
        list.appendChild(h);

        previous.forEach(q => {
          const card = makeCard(q, false);
          const link = document.createElement("a");
          link.href = `leaderboard.html?quiz=${q.id}`;
          link.className = "hint";
          link.style.marginLeft = "10px";
          link.textContent = areResultsVisible(q) ? "→ লিডারবোর্ড দেখো" : "(ফলাফল শীঘ্রই)";
          card.appendChild(link);
          list.appendChild(card);
        });
      }
    }
  }
</script>
</body>
</html>
