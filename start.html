<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start exam — Porikkhaloy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="shell">
    <a href="index.html" class="brand"><span class="brand-bn" data-i18n="brand">Porikkhaloy</span></a>
    <nav style="display:flex; gap:16px; align-items:center;" id="nav-extra"></nav>
  </div>
</header>

<main>
  <div class="shell">
    <section class="block">
      <h2 id="quiz-title" data-i18n="loading">Loading…</h2>
      <p class="hint" id="quiz-meta" style="margin-bottom:24px;"></p>

      <div class="error-box" id="err"></div>

      <!-- signed-in student: just confirm + go -->
      <div class="card" id="signed-in-card" style="display:none;">
        <p class="hint" id="signed-in-line" style="margin-bottom:18px;"></p>
        <button class="btn btn-primary" id="signed-in-start-btn" data-i18n="startExamBtn">Start an exam</button>
        <p class="hint" style="margin-top:10px;" data-i18n="notYouSwitch">Not you? Log out and start again.</p>
      </div>

      <!-- guest form -->
      <form class="card" id="start-form" style="display:none;">
        <div class="field"><label data-i18n="fullName">Full name</label><input type="text" id="name" required></div>
        <div class="field">
          <label data-i18n="className">Class</label>
          <select id="cls" required>
            <option value="" data-i18n="selectClass">-- Select Class --</option>
            <option value="Class 9">Class 9</option>
            <option value="Class 10">Class 10</option>
            <option value="Class 11">Class 11</option>
            <option value="Class 12">Class 12</option>
          </select>
        </div>
        <div class="field"><label data-i18n="phoneNumber">Phone number</label><input type="tel" id="phone" required></div>
        <p class="hint" style="margin-bottom:20px;" data-i18n="startRulesText">
          Once you start, the timer begins. Switching tabs or leaving the page shows a warning — if you don't return in time, the exam is auto-submitted.
        </p>
        <button type="submit" class="btn btn-primary" id="submit-btn" data-i18n="startExamBtn">Start an exam</button>
      </form>
    </section>
  </div>
</main>

<script type="module">
  import { applyI18n, t } from "./js/i18n.js";
  import { applyTheme } from "./js/theme.js";
  import { renderSiteNavExtras } from "./js/site-header.js";
  import { getQuiz, hasAttempted, startAttempt, getExamWindowStatus } from "./js/data.js";
  import { watchStudentAuth, getStudentProfile } from "./js/student-auth.js";

  applyTheme();
  applyI18n();
  renderSiteNavExtras(document.getElementById("nav-extra"));

  const quizId = new URLSearchParams(location.search).get("quiz");
  const err = document.getElementById("err");
  const guestForm = document.getElementById("start-form");
  const signedInCard = document.getElementById("signed-in-card");

  const quiz = await getQuiz(quizId);

  if (!quiz) {
    document.getElementById("quiz-title").textContent = t("quizNotFound");
  } else {
    document.getElementById("quiz-title").textContent = quiz.title_bn;
    document.getElementById("quiz-meta").textContent =
      `${t("duration")}: ${Math.floor(quiz.durationSeconds / 60)} ${t("minutes")} · ${t("questions")}: ${(quiz.questions || []).length}`;

    const locked = hasAttempted(quizId);
    const windowStatus = getExamWindowStatus(quiz);

    if (windowStatus === "not_started") {
      err.textContent = `${t("examStartsAt")} ${new Date(quiz.examStartAt).toLocaleString()}`;
      err.classList.add("show");
    } else if (windowStatus === "closed") {
      err.textContent = t("examClosed");
      err.classList.add("show");
    } else if (locked) {
      err.textContent = t("alreadyAttemptedMsg");
      err.classList.add("show");
    }

    const windowBlocked = windowStatus !== "open";

    let studentProfile = null;
    let studentUid = null;

    watchStudentAuth(async (user) => {
      if (user) {
        studentUid = user.uid;
        studentProfile = await getStudentProfile(user.uid);
        guestForm.style.display = "none";

        const profileIncomplete = !studentProfile?.cls || !studentProfile?.phone;
        if (profileIncomplete && !locked && !windowBlocked) {
          signedInCard.style.display = "none";
          err.innerHTML = `${t("completeProfileFirst")} <a href="profile.html">${t("goToProfile")}</a>`;
          err.classList.add("show");
        } else {
          signedInCard.style.display = (locked || windowBlocked) ? "none" : "block";
        }
        document.getElementById("signed-in-line").textContent =
          `${t("signedInAs")} ${studentProfile?.name || user.email} (${studentProfile?.cls || ""})`;
      } else {
        signedInCard.style.display = "none";
        guestForm.style.display = (locked || windowBlocked) ? "none" : "block";
      }
    });

    document.getElementById("signed-in-start-btn")?.addEventListener("click", () => {
      if (hasAttempted(quizId) || getExamWindowStatus(quiz) !== "open") return;
      if (!studentProfile?.cls || !studentProfile?.phone) return;
      const student = {
        name: studentProfile?.name || "",
        cls: studentProfile?.cls || "",
        phone: studentProfile?.phone || "",
        email: studentProfile?.email || "",
        uid: studentUid,
      };
      const attemptId = startAttempt(quizId, student);
      location.href = `quiz.html?attempt=${attemptId}`;
    });

    guestForm.addEventListener("submit", (e) => {
      e.preventDefault();
      if (hasAttempted(quizId) || getExamWindowStatus(quiz) !== "open") return;
      const student = {
        name: document.getElementById("name").value.trim(),
        cls: document.getElementById("cls").value.trim(),
        phone: document.getElementById("phone").value.trim(),
      };
      // Real backend: this call goes to the Worker, which checks the
      // requester's IP against ipAttempts/{quizId}_{ip} before creating
      // the attempt. Here we just lock it in localStorage.
      const attemptId = startAttempt(quizId, student);
      location.href = `quiz.html?attempt=${attemptId}`;
    });
  }
</script>
</body>
</html>
