<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>পরীক্ষা শুরু করো — পরীক্ষালয়</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="shell">
    <a href="index.html" class="brand"><span class="brand-bn">পরীক্ষালয়</span><small>Porikkhaloy</small></a>
  </div>
</header>

<main>
  <div class="shell">
    <section class="block">
      <h2 id="quiz-title">তোমার তথ্য দাও</h2>
      <p class="hint" id="quiz-meta" style="margin-bottom:24px;"></p>

      <div class="error-box" id="err"></div>

      <form class="card" id="start-form">
        <div class="field">
          <label for="name">পূর্ণ নাম</label>
          <input type="text" id="name" required>
        </div>
        <div class="field">
          <label for="cls">ক্লাস</label>
          <input type="text" id="cls" placeholder="যেমন: HSC ২য় বর্ষ" required>
        </div>
        <div class="field">
          <label for="roll">রোল নম্বর</label>
          <input type="text" id="roll" required>
        </div>
        <p class="hint" style="margin-bottom:20px;">
          শুরু করার পর টাইমার চালু হবে। ট্যাব পরিবর্তন করলে বা পেজ ছেড়ে গেলে একটি সতর্কবার্তা
          দেখানো হবে — সময়মতো না ফিরলে পরীক্ষা স্বয়ংক্রিয়ভাবে জমা হয়ে যাবে।
        </p>
        <button type="submit" class="btn btn-primary" id="submit-btn">পরীক্ষা শুরু করো</button>
      </form>
    </section>
  </div>
</main>

<script src="js/data.js"></script>
<script>
  const quizId = new URLSearchParams(location.search).get("quiz");
  const quiz = getQuiz(quizId);
  const err = document.getElementById("err");

  if (!quiz) {
    document.getElementById("quiz-title").textContent = "পরীক্ষা খুঁজে পাওয়া যায়নি";
    document.getElementById("start-form").style.display = "none";
  } else {
    document.getElementById("quiz-title").textContent = quiz.title_bn;
    document.getElementById("quiz-meta").textContent =
      `সময়সীমা: ${Math.floor(quiz.durationSeconds / 60)} মিনিট · প্রশ্ন সংখ্যা: ${quiz.questions.length}`;

    if (hasAttempted(quizId)) {
      err.textContent = "এই নেটওয়ার্ক থেকে তুমি ইতিমধ্যে এই পরীক্ষায় অংশ নিয়েছ। প্রতিটি সংযোগ থেকে একবারই অংশ নেওয়া যায়।";
      err.classList.add("show");
      document.getElementById("submit-btn").disabled = true;
    }
  }

  document.getElementById("start-form").addEventListener("submit", (e) => {
    e.preventDefault();
    if (hasAttempted(quizId)) return;

    const student = {
      name: document.getElementById("name").value.trim(),
      cls: document.getElementById("cls").value.trim(),
      roll: document.getElementById("roll").value.trim(),
    };
    // Real backend: this call goes to the Worker, which checks the
    // requester's IP against ipAttempts/{quizId}_{ip} before creating
    // the attempt. Here we just lock it in localStorage.
    const attemptId = startAttempt(quizId, student);
    location.href = `quiz.html?attempt=${attemptId}`;
  });
</script>
</body>
</html>
