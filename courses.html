<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courses — Porikkhaloy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="shell">
    <a href="index.html" class="brand"><span class="brand-bn" data-i18n="brand">Porikkhaloy</span></a>
    <nav style="display:flex; gap:16px; align-items:center;" id="nav-extra"></nav>
  </div>
</header>

<main>
  <div class="shell" style="max-width:640px;">
    <section class="block" id="content">
      <p class="hint" data-i18n="loading">Loading…</p>
    </section>
  </div>
</main>

<script type="module">
  import { applyI18n, t } from "./js/i18n.js";
  import { applyTheme } from "./js/theme.js";
  import { renderSiteNavExtras } from "./js/site-header.js";
  import { watchStudentAuth, getStudentProfile } from "./js/student-auth.js";

  applyTheme();
  applyI18n();
  renderSiteNavExtras(document.getElementById("nav-extra"));

  const content = document.getElementById("content");

  watchStudentAuth(async (user) => {
    if (!user) {
      location.href = "student-login.html";
      return;
    }
    const profile = await getStudentProfile(user.uid);
    if (profile?.isPaid) {
      content.innerHTML = `
        <h2>${t("coursesTitle")}</h2>
        <p class="hint">${t("coursesComingSoon")}</p>
      `;
    } else {
      content.innerHTML = `
        <h2>${t("coursesLockedTitle")}</h2>
        <p class="hint">${t("coursesLockedDesc")}</p>
      `;
    }
  });
</script>
</body>
</html>
