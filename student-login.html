<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Porikkhaloy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="shell">
    <a href="index.html" class="brand"><span class="brand-bn" data-i18n="brand">Porikkhaloy</span></a>
    <nav style="display:flex; gap:16px; align-items:center;" id="nav-extra"></nav>
  </div>
</header>

<main>
  <div class="shell" style="max-width:420px;">
    <h1 style="font-size:1.6rem;" data-i18n="logInTitle">Log in</h1>

    <div class="error-box" id="err"></div>

    <button class="btn btn-outline" id="google-btn" style="width:100%; margin-bottom:18px;" data-i18n="continueGoogle">Continue with Google</button>
    <div style="text-align:center; color:var(--ink-soft); font-size:.85rem; margin-bottom:18px;" data-i18n="or">or</div>

    <form class="card" id="login-form" style="max-width:100%;">
      <div class="field"><label data-i18n="email">Email</label><input type="email" id="email" required></div>
      <div class="field"><label data-i18n="password">Password</label><input type="password" id="password" required></div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="submit-btn" data-i18n="logIn">Log in</button>
    </form>

    <p class="hint" style="margin-top:16px;">
      <span data-i18n="noAccount">Don't have an account?</span>
      <a href="signup.html" data-i18n="signUp">Sign up</a>
    </p>
  </div>
</main>

<script type="module">
  import { applyI18n, t } from "./js/i18n.js";
  import { applyTheme } from "./js/theme.js";
  import { renderSiteNavExtras } from "./js/site-header.js";
  import { signInStudent, logInWithGoogle } from "./js/student-auth.js";

  applyTheme();
  applyI18n();
  renderSiteNavExtras(document.getElementById("nav-extra"));

  const err = document.getElementById("err");

  document.getElementById("google-btn").addEventListener("click", async () => {
    err.classList.remove("show");
    try {
      await logInWithGoogle();
      location.href = "profile.html";
    } catch (e) {
      err.textContent = e.message;
      err.classList.add("show");
    }
  });

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    err.classList.remove("show");
    try {
      await signInStudent(
        document.getElementById("email").value.trim(),
        document.getElementById("password").value
      );
      location.href = "profile.html";
    } catch (e2) {
      err.textContent = e2.message;
      err.classList.add("show");
    }
  });
</script>
</body>
</html>
