<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Profile — Porikkhaloy</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="shell">
    <a href="index.html" class="brand"><span class="brand-bn" data-i18n="brand">Porikkhaloy</span></a>
    <nav style="display:flex; gap:16px; align-items:center;">
      <span id="theme-slot"></span>
      <span id="lang-slot"></span>
      <a href="#" id="logout-link" class="hint" data-i18n="logOut">Log out</a>
    </nav>
  </div>
</header>

<main>
  <div class="shell" style="max-width:640px;">

    <section style="display:flex; align-items:center; gap:18px; margin-bottom:36px;">
      <div id="avatar" style="width:64px; height:64px; border-radius:50%; background:var(--indigo); color:var(--paper); display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:1.5rem; font-weight:600; flex-shrink:0;"></div>
      <div>
        <h1 style="font-size:1.5rem; margin-bottom:2px;" id="profile-name" data-i18n="loading">Loading…</h1>
        <p class="hint" id="profile-email" style="margin:0;"></p>
      </div>
    </section>

    <div class="error-box" id="msg"></div>

    <section class="card" style="max-width:100%; margin-bottom:24px;">
      <h2 style="font-size:1.05rem; border-bottom:1px solid var(--rule); padding-bottom:12px; margin-bottom:20px;" data-i18n="profileTitle">My Profile</h2>
      <form id="profile-form">
        <div class="field"><label data-i18n="fullName">Full name</label><input type="text" id="name"></div>
        <div class="field"><label data-i18n="className">Class</label><input type="text" id="cls"></div>
        <div class="field"><label data-i18n="phoneNumber">Phone number</label><input type="tel" id="phone"></div>
        <div class="field"><label data-i18n="email">Email</label><input type="email" id="email" disabled style="background:var(--paper-2);"></div>
        <button type="submit" class="btn btn-primary" data-i18n="saveChanges">Save changes</button>
      </form>
    </section>

    <section class="card" style="max-width:100%; display:flex; gap:14px; flex-wrap:wrap;">
      <a href="my-exams.html" class="btn btn-outline" style="flex:1; text-align:center; min-width:160px;" data-i18n="navMyExams">My Exams</a>
      <a href="index.html#subjects" class="btn btn-outline" style="flex:1; text-align:center; min-width:160px;" data-i18n="navExams">Exams</a>
    </section>

  </div>
</main>

<script type="module">
  import { applyI18n, renderLangToggle, t } from "./js/i18n.js";
  import { applyTheme, renderThemeToggle } from "./js/theme.js";
  import { watchStudentAuth, getStudentProfile, updateStudentProfile, signOutStudent } from "./js/student-auth.js";

  applyTheme();
  applyI18n();
  renderLangToggle(document.getElementById("lang-slot"));
  renderThemeToggle(document.getElementById("theme-slot"));

  const msg = document.getElementById("msg");
  msg.style.background = "#e2ecdf";
  msg.style.borderColor = "var(--good)";
  msg.style.color = "var(--good)";

  let currentUid = null;

  watchStudentAuth(async (user) => {
    if (!user) {
      location.href = "student-login.html";
      return;
    }
    currentUid = user.uid;
    const profile = await getStudentProfile(user.uid);

    const name = profile?.name || user.email || "";
    document.getElementById("name").value = profile?.name || "";
    document.getElementById("cls").value = profile?.cls || "";
    document.getElementById("phone").value = profile?.phone || "";
    document.getElementById("email").value = user.email || "";

    document.getElementById("profile-name").textContent = name;
    document.getElementById("profile-email").textContent = user.email || "";
    document.getElementById("avatar").textContent = (name.trim()[0] || "?").toUpperCase();
  });

  document.getElementById("profile-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!currentUid) return;
    const name = document.getElementById("name").value.trim();
    await updateStudentProfile(currentUid, {
      name,
      cls: document.getElementById("cls").value.trim(),
      phone: document.getElementById("phone").value.trim(),
    });
    document.getElementById("profile-name").textContent = name || document.getElementById("email").value;
    document.getElementById("avatar").textContent = (name.trim()[0] || "?").toUpperCase();
    msg.textContent = t("saved");
    msg.classList.add("show");
    setTimeout(() => msg.classList.remove("show"), 2500);
  });

  document.getElementById("logout-link").addEventListener("click", async (e) => {
    e.preventDefault();
    await signOutStudent();
    location.href = "index.html";
  });
</script>
</body>
</html>
